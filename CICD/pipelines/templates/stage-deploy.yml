# Un stage de déploiement Fabric pour un environnement.
#
# Conditions d'entrée (v1.2) : Validate_Artifact réussi ET environnement cible du run
#   (targetEnv, calculé selon la branche source : develop → ITG, release/* → PPR,
#   main → PRD) égal à cet environnement ; checks de l'Environment ADO <prefix><env>
#   validés (approbation PPR/PRD, verrou exclusif, contrôle de branche, template requis).
# Artefact consommé : ressource pipeline « ci » (même run pour tous les stages),
#   empreinte contrôlée contre deployment-manifest.json.
# Secrets : AzureKeyVault@2 lit dans le coffre les 3 secrets de l'environnement
#   (<ENV>-AZURE-CLIENT-ID, <ENV>-AZURE-CLIENT-SECRET, <ENV>-AZURE-TENANT-ID) avec la
#   service connection de l'environnement ; ils sont passés au script par variables
#   d'environnement et masqués dans les journaux.
# Opérations : intégrité → secrets Key Vault → pré-vol → [porte Framework : ADP et BDP seulement, v1.3]
#   → publication fabric-cicd → vérification post-déploiement → rapport.
# Arrêt : tout code de sortie non nul de deploy.py fait échouer le stage, donc
#   les stages suivants ne s'exécutent pas.
parameters:
  - name: env
    type: string
    values: [DEV, ITG, PPR, PRD]
  - name: mode
    type: string
    values: [validate, deploy]
  - name: dependsOn
    type: object
  - name: condition
    type: string
    default: succeeded()
  - name: branchPolicy
    type: string
  - name: repository
    type: string
  - name: role
    type: string
  - name: ciAlias
    type: string
  - name: artifactName
    type: string
  - name: artifactSubPath
    type: string
  - name: authMode
    type: string
  - name: secretSource
    type: string
  - name: keyVaultName
    type: string
  - name: serviceConnections
    type: object
  - name: frameworkGate
    type: string
  - name: frameworkPipelineName
    type: string
  - name: adoEnvironmentPrefix
    type: string
  - name: pool
    type: object
  - name: pythonVersion
    type: string

stages:
  - stage: Deploy_${{ parameters.env }}
    displayName: "${{ parameters.env }} — ${{ parameters.mode }}"
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    lockBehavior: sequential
    variables:
      - name: ARTIFACT_DIR
        value: "$(Pipeline.Workspace)/${{ parameters.ciAlias }}/${{ parameters.artifactName }}/${{ parameters.artifactSubPath }}"
      - name: TOOLS
        value: "$(Pipeline.Workspace)/s/cicd_common/tools"
      - name: REPORT_DIR
        value: "$(Build.ArtifactStagingDirectory)/reports"
      - name: FRAMEWORK_GATE
        # Pas de porte en DEV : DEV est alimenté par Git Integration, pas par la CD Framework.
        value: ${{ iif(and(eq(parameters.role, 'consumer'), ne(parameters.env, 'DEV')), parameters.frameworkGate, 'off') }}
    jobs:
      - deployment: Deploy
        displayName: "${{ parameters.repository }} → ${{ parameters.env }}"
        pool: ${{ parameters.pool }}
        environment: ${{ format('{0}{1}', parameters.adoEnvironmentPrefix, lower(parameters.env)) }}
        timeoutInMinutes: 90
        strategy:
          runOnce:
            deploy:
              steps:
                # Garde à la compilation : service connection obligatoire en mode cli ou keyVault.
                - ${{ if and(or(eq(parameters.authMode, 'cli'), eq(parameters.secretSource, 'keyVault')), eq(parameters.serviceConnections[parameters.env], '')) }}:
                    - script: |
                        echo "##vso[task.logissue type=error]serviceConnections.${{ parameters.env }} vide alors que authMode=${{ parameters.authMode }} / secretSource=${{ parameters.secretSource }}"
                        exit 1
                      displayName: "Configuration invalide : service connection ${{ parameters.env }} manquante"
                # Garde à la compilation : nom de service connection non confirmé (marqueur __A_CONFIRMER_…).
                - ${{ if contains(parameters.serviceConnections[parameters.env], '__A_CONFIRMER') }}:
                    - script: |
                        echo "##vso[task.logissue type=error]serviceConnections.${{ parameters.env }} : service connection Key Vault à confirmer (marqueur présent)"
                        exit 1
                      displayName: "Configuration invalide : service connection Key Vault ${{ parameters.env }} à confirmer"
                # Garde à la compilation (v1.1) : une service connection DISTINCTE par environnement
                # (ITG, PPR, PRD). Celle d'un stage ne doit être déclarée pour aucun autre environnement :
                # l'identité ITG ne peut jamais lire les secrets PPR/PRD, et inversement.
                - ${{ each sc in parameters.serviceConnections }}:
                    - ${{ if and(ne(parameters.env, 'DEV'), ne(sc.key, 'DEV'), ne(sc.key, parameters.env), eq(sc.value, parameters.serviceConnections[parameters.env])) }}:
                        - script: |
                            echo "##vso[task.logissue type=error]serviceConnections.${{ parameters.env }} = serviceConnections.${{ sc.key }} : une service connection distincte par environnement est obligatoire"
                            exit 1
                          displayName: "Configuration invalide : service connection ${{ parameters.env }} partagée avec ${{ sc.key }}"
                - script: mkdir -p "$(REPORT_DIR)"
                  displayName: "Dossier du rapport"
                - checkout: cicd_common
                  path: s/cicd_common
                  fetchDepth: 1
                - download: ${{ parameters.ciAlias }}
                  artifact: ${{ parameters.artifactName }}
                  displayName: "Artefact CI (même run que Validate_Artifact)"
                - download: current
                  artifact: deployment-manifest
                  displayName: "Manifeste de déploiement"

                - template: steps-python.yml
                  parameters:
                    pythonVersion: ${{ parameters.pythonVersion }}

                - script: >-
                    python "$(TOOLS)/deploy.py" check-branch --branch "$CI_SOURCE_BRANCH"
                    --env ${{ parameters.env }} --policy "${{ parameters.branchPolicy }}"
                  displayName: "Branche source autorisée pour ${{ parameters.env }}"
                  env:
                    CI_SOURCE_BRANCH: $(resources.pipeline.${{ parameters.ciAlias }}.sourceBranch)

                - script: >-
                    python "$(TOOLS)/deploy.py" manifest --path "$(ARTIFACT_DIR)"
                    --check "$(Pipeline.Workspace)/deployment-manifest/deployment-manifest.json"
                  displayName: "Intégrité de l'artefact (SHA-256)"

                - ${{ if eq(parameters.secretSource, 'keyVault') }}:
                    - task: AzureKeyVault@2
                      displayName: "Secrets ${{ parameters.env }} depuis ${{ parameters.keyVaultName }}"
                      inputs:
                        azureSubscription: ${{ parameters.serviceConnections[parameters.env] }}
                        KeyVaultName: ${{ parameters.keyVaultName }}
                        # Noms des secrets du coffre frfrkvdevdp0001 (constatés le 19/10/2026) :
                        # <ENV>-AZURE-CLIENT-ID, <ENV>-AZURE-CLIENT-SECRET, <ENV>-AZURE-TENANT-ID.
                        # Seuls les 3 secrets de l'environnement du stage sont lus.
                        SecretsFilter: ${{ format('{0}-AZURE-CLIENT-ID,{0}-AZURE-CLIENT-SECRET,{0}-AZURE-TENANT-ID', parameters.env) }}
                        RunAsPreJob: false

                # ---- Authentification par secret (transitoire) ------------------
                - ${{ if eq(parameters.authMode, 'secret') }}:
                    - script: >-
                        python "$(TOOLS)/deploy.py" deploy --repo "$(ARTIFACT_DIR)"
                        --env ${{ parameters.env }} --mode ${{ parameters.mode }} --auth secret
                        --framework-gate "$(FRAMEWORK_GATE)" --framework-pipeline "${{ parameters.frameworkPipelineName }}"
                        --expected-role ${{ parameters.role }}
                        --report-dir "$(REPORT_DIR)"
                      displayName: "Pré-vol, publication et vérification (${{ parameters.env }})"
                      env:
                        FABRIC_TENANT_ID: $(${{ format('{0}-AZURE-TENANT-ID', parameters.env) }})
                        FABRIC_CLIENT_ID: $(${{ format('{0}-AZURE-CLIENT-ID', parameters.env) }})
                        FABRIC_CLIENT_SECRET: $(${{ format('{0}-AZURE-CLIENT-SECRET', parameters.env) }})
                        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                        CI_RUN_ID: $(resources.pipeline.${{ parameters.ciAlias }}.runID)
                        CI_RUN_NAME: $(resources.pipeline.${{ parameters.ciAlias }}.runName)
                        CI_COMMIT: $(resources.pipeline.${{ parameters.ciAlias }}.sourceCommit)

                # ---- Fédération d'identité (cible : aucun secret) ---------------
                - ${{ if eq(parameters.authMode, 'cli') }}:
                    - task: AzureCLI@2
                      displayName: "Pré-vol, publication et vérification (${{ parameters.env }}, identité fédérée)"
                      inputs:
                        azureSubscription: ${{ parameters.serviceConnections[parameters.env] }}
                        scriptType: bash
                        scriptLocation: inlineScript
                        inlineScript: >-
                          python "$(TOOLS)/deploy.py" deploy --repo "$(ARTIFACT_DIR)"
                          --env ${{ parameters.env }} --mode ${{ parameters.mode }} --auth cli
                          --framework-gate "$(FRAMEWORK_GATE)" --framework-pipeline "${{ parameters.frameworkPipelineName }}"
                          --expected-role ${{ parameters.role }}
                          --report-dir "$(REPORT_DIR)"
                      env:
                        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                        CI_RUN_ID: $(resources.pipeline.${{ parameters.ciAlias }}.runID)
                        CI_RUN_NAME: $(resources.pipeline.${{ parameters.ciAlias }}.runName)
                        CI_COMMIT: $(resources.pipeline.${{ parameters.ciAlias }}.sourceCommit)

                - publish: "$(REPORT_DIR)"
                  artifact: "deployment-report-${{ parameters.env }}-$(System.JobAttempt)"
                  displayName: "Rapport de déploiement"
                  condition: always()
