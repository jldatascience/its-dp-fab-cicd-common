# Pipeline de validation de Pull Request (contrôles CI réels et bloquants).
#
# Étendu par PR-Validation.yml de chaque dépôt. Le résultat est publié comme
# « check » sur la PR GitHub et rendu OBLIGATOIRE par la branch protection de
# develop, release/* et main (Settings → Branches → Require status checks to pass).
#
# Aucun accès au tenant Fabric, aucun secret : ces contrôles portent sur le
# contenu du dépôt uniquement.
# ── parameters — contrat du template de validation
parameters:
  - name: pythonVersion
    type: string
    default: "3.12"
  - name: cicdRoot
    # Dossier CI/CD du dépôt consommateur (deployment/, pipelines/), relatif à sa racine.
    # Transmis à deploy.py par la variable d'environnement CICD_ROOT (DEPLOYMENT_DIR = <cicdRoot>/deployment).
    # Hors dossier à un seul niveau (ex. a/b) : repository_directory explicite dans config.yml.
    displayName: "Dossier CI/CD du dépôt consommateur (contient deployment/)"
    type: string
    default: CICD
  - name: commonCicdRoot
    # Dossier CI/CD du socle (tools/, pipelines/), relatif à son checkout $(Pipeline.Workspace)/s/cicd_common.
    # Indépendant de cicdRoot : changer le dossier du consommateur ne casse pas le chemin vers le socle.
    displayName: "Dossier CI/CD du socle commun (contient tools/), relatif à s/cicd_common"
    type: string
    default: CICD
  - name: pool
    type: object
    default:
      vmImage: ubuntu-24.04

# ── stages — etapes de validation
stages:
  - stage: Validate
    displayName: "Validation du dépôt Fabric"
    jobs:
      - job: Static
        displayName: "Contrôles statiques bloquants"
        pool: ${{ parameters.pool }}
        timeoutInMinutes: 20
        steps:
          - checkout: self
            path: s/repo
            fetchDepth: 1
          - checkout: cicd_common
            path: s/cicd_common
            fetchDepth: 1

          - template: steps-python.yml
            parameters:
              pythonVersion: ${{ parameters.pythonVersion }}
              commonCicdRoot: ${{ parameters.commonCicdRoot }}

          - script: |
              set -euo pipefail
              python -m pip install --disable-pip-version-check --no-input "yamllint>=1.35,<2"
              cd "$(Pipeline.Workspace)/s/repo"
              # <cicdRoot>/deployment/ et <cicdRoot>/pipelines/ (CI.yml, CD.yml, PR-Validation.yml)
              yamllint -c "$(Pipeline.Workspace)/s/cicd_common/.yamllint.yml" \
                "${{ parameters.cicdRoot }}/deployment" "${{ parameters.cicdRoot }}/pipelines"
            displayName: "Syntaxe YAML (${{ parameters.cicdRoot }}/deployment et ${{ parameters.cicdRoot }}/pipelines)"

          - script: |
              set -euo pipefail
              python "$(Pipeline.Workspace)/s/cicd_common/${{ parameters.commonCicdRoot }}/tools/deploy.py" validate \
                --repo "$(Pipeline.Workspace)/s/repo" \
                --inventory-csv "$(Build.ArtifactStagingDirectory)/guid-inventory.csv"
            displayName: "Structure, JSON, config.yml, parameter.yml, GUID, secrets"
            env:
              CICD_ROOT: ${{ parameters.cicdRoot }}

          - publish: "$(Build.ArtifactStagingDirectory)"
            artifact: "validation-$(System.JobAttempt)"
            displayName: "Inventaire des GUID (artefact)"
            condition: always()
